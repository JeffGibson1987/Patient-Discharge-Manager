name: CaseLog
options:
  bundleIdPrefix: com.jeffgibson
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""   # set to your Apple Developer Team ID
targets:
  CaseLog:
    type: application
    platform: iOS
    sources:
      - path: CaseLog
    entitlements:
      path: CaseLog/CaseLog.entitlements
      properties:
        # Every file the app creates is unreadable while the phone is locked.
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    info:
      path: CaseLog/Info.plist
      properties:
        CFBundleDisplayName: Case Log
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: Face ID unlocks your case log, which contains patient information.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffgibson.caselog
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
  CaseLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CaseLogTests
    dependencies:
      - target: CaseLog
schemes:
  CaseLog:
    build:
      targets:
        CaseLog: all
        CaseLogTests: [test]
    test:
      targets:
        - CaseLogTests
